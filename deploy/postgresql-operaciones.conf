# PostgreSQL ajustado para Lightsail 16 GB / 4 vCPU con la aplicación en el mismo servidor.
# Se copia a /etc/postgresql/<versión>/main/conf.d/operaciones.conf y se reinicia PostgreSQL (lo hace instalar_ubuntu.sh).
# PostgreSQL usa ~1/4 de la RAM y deja el resto a la aplicación (gunicorn) y a la caché de disco del sistema.
listen_addresses = 'localhost'          # nunca expuesto: la app se conecta por 127.0.0.1
max_connections = 100                   # 5 procesos gunicorn × (5 + 10 de reserva) = 75 como máximo
shared_buffers = 4GB
effective_cache_size = 10GB
work_mem = 16MB                         # por operación de ordenamiento; informes grandes sin usar disco
maintenance_work_mem = 512MB            # índices y VACUUM más rápidos
wal_compression = on
checkpoint_completion_target = 0.9
max_wal_size = 2GB
random_page_cost = 1.1                  # disco SSD
effective_io_concurrency = 200
default_statistics_target = 100
log_min_duration_statement = 2000       # consultas de más de 2 s quedan en el registro de PostgreSQL
log_timezone = 'America/Lima'
timezone = 'America/Lima'
